services:
  # PostgreSQL: no local container — all repos share one Postgres server
  # (admin-service-postgres, published on host port 5432, db clan_platform).
  # Reached via host.docker.internal since it lives in platform-domain-be's
  # docker-compose project (only joins that repo's own admin-network).

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: clan-identity-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - clan-identity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: clan-auth-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: auth-service
      # RS256 + JWKS so the API gateway (Envoy) can validate tokens at the edge.
      # Dev: keys auto-generate at startup; iss/aud must match the gateway config.
      JWT_ALGORITHM: RS256
      JWT_ISSUER: clan-identity
      JWT_AUDIENCE: api-gateway
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # Admin Service Database (External Repository) — same physical DB as
      # POSTGRES_* above now that all repos share one Postgres server.
      ADMIN_POSTGRES_HOST: ${ADMIN_POSTGRES_HOST:-host.docker.internal}
      ADMIN_POSTGRES_PORT: ${ADMIN_POSTGRES_PORT:-5432}
      ADMIN_POSTGRES_USER: ${ADMIN_POSTGRES_USER:-postgres}
      ADMIN_POSTGRES_PASSWORD: ${ADMIN_POSTGRES_PASSWORD:-root}
      ADMIN_DB: ${ADMIN_DB:-clan_platform}
      # GeoIP enrichment for login_attempts (files created by scripts/download_geoip.sh)
      GEOIP_CITY_DB: /geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DB: /geoip/GeoLite2-ASN.mmdb
      # Local-dev login conveniences (see core/config.py). Do NOT set these on
      # a real deployment: ALLOW_HASH_LOGIN makes the stored password hash a
      # working credential; AUTH_TENANT_DB_SCAN scans every tenant DB when an
      # email can't be routed otherwise.
      ALLOW_HASH_LOGIN: "true"
      AUTH_TENANT_DB_SCAN: "true"
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/auth-service:/app
      - ./libs:/libs
      - ./data/geoip:/geoip:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # User Service
  user-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: clan-user-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: user-service
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${USER_SERVICE_PORT:-8002}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/user-service:/app
      - ./libs:/libs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Session Service
  session-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: session-service
    container_name: clan-session-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: session-service
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${SESSION_SERVICE_PORT:-8003}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/session-service:/app
      - ./libs:/libs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # RBAC Service
  rbac-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: rbac-service
    container_name: clan-rbac-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: rbac-service
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${RBAC_SERVICE_PORT:-8004}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/rbac-service:/app
      - ./libs:/libs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # OAuth Service
  oauth-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: oauth-service
    container_name: clan-oauth-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: oauth-service
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${OAUTH_SERVICE_PORT:-8005}:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/oauth-service:/app
      - ./libs:/libs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
    driver: local

networks:
  clan-identity-network:
    driver: bridge
  clan-network:
    external: true

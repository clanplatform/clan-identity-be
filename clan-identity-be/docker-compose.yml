services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: clan-identity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-clan_identity}
      POSTGRES_MULTIPLE_DATABASES: clan_identity,user_service,session_service,rbac_service,oauth_service
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - clan-identity-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: clan-identity-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - clan-identity-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: clan-auth-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: auth-service
      # RS256 + JWKS so the API gateway (Envoy) can validate tokens at the edge.
      # Dev: keys auto-generate at startup; iss/aud must match the gateway config.
      JWT_ALGORITHM: RS256
      JWT_ISSUER: clan-identity
      JWT_AUDIENCE: api-gateway
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: clan_identity
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
      # Admin Service Database (External Repository)
      ADMIN_POSTGRES_HOST: ${ADMIN_POSTGRES_HOST:-host.docker.internal}
      ADMIN_POSTGRES_PORT: ${ADMIN_POSTGRES_PORT:-5432}
      ADMIN_POSTGRES_USER: ${ADMIN_POSTGRES_USER:-postgres}
      ADMIN_POSTGRES_PASSWORD: ${ADMIN_POSTGRES_PASSWORD:-root}
      ADMIN_DB: ${ADMIN_DB:-clan_platform}
    ports:
      - "${AUTH_SERVICE_PORT:-8001}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/auth-service:/app
      - ./libs:/libs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # User Service
  user-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: user-service
    container_name: clan-user-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: user-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: user_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${USER_SERVICE_PORT:-8002}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/user-service:/app
      - ./libs:/libs

  # Session Service
  session-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: session-service
    container_name: clan-session-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: session-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: session_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${SESSION_SERVICE_PORT:-8003}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/session-service:/app
      - ./libs:/libs

  # RBAC Service
  rbac-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: rbac-service
    container_name: clan-rbac-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: rbac-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: rbac_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${RBAC_SERVICE_PORT:-8004}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/rbac-service:/app
      - ./libs:/libs

  # OAuth Service
  oauth-service:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE_NAME: oauth-service
    container_name: clan-oauth-service
    restart: unless-stopped
    env_file:
      - ./config/environments/.env.local
    environment:
      SERVICE_NAME: oauth-service
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: oauth_service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}
    ports:
      - "${OAUTH_SERVICE_PORT:-8005}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - clan-identity-network
      - clan-network
    volumes:
      - ./services/oauth-service:/app
      - ./libs:/libs

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  clan-identity-network:
    driver: bridge
  clan-network:
    external: true

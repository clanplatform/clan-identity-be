# Render Infrastructure-as-Code
# Two environments: prod (encryption ON) and dev (encryption OFF)
# Docs: https://render.com/docs/infrastructure-as-code

envVarGroups:
  # ── Shared prod encryption settings ──────────────────────────────────
  - name: prod-encryption
    envVars:
      - key: PAYLOAD_ENCRYPTION_ENABLED
        value: "true"
      - key: ENCRYPTION_ALGORITHM
        value: AES-256-GCM
      - key: ENCRYPTION_EXCLUDE_PATHS
        value: /health,/,/api/v1/docs,/api/v1/openapi.json,/api/v1/redoc
      - key: ENCRYPTION_REQUIRE_ENCRYPTED_REQUESTS
        value: "true"
      # Set PAYLOAD_ENCRYPTION_KEY and AUTH/USER/etc _SERVICE_ENCRYPTION_KEY
      # manually in Render dashboard — never commit real keys

  # ── Shared dev encryption settings (disabled) ────────────────────────
  - name: dev-encryption
    envVars:
      - key: PAYLOAD_ENCRYPTION_ENABLED
        value: "false"
      - key: ENCRYPTION_REQUIRE_ENCRYPTED_REQUESTS
        value: "false"

# ════════════════════════════════════════════════════════════════════════
# DATABASES
# ════════════════════════════════════════════════════════════════════════
databases:
  - name: clan-identity-db-prod
    databaseName: clan_identity
    user: clan_prod
    plan: starter
    region: singapore

  - name: clan-identity-db-dev
    databaseName: clan_identity
    user: clan_dev
    plan: free
    region: singapore

# ════════════════════════════════════════════════════════════════════════
# SERVICES
# ════════════════════════════════════════════════════════════════════════
services:

  # ──────────────────────────────────────────────────────────────────────
  # REDIS
  # ──────────────────────────────────────────────────────────────────────
  - type: redis
    name: clan-identity-redis-prod
    plan: starter
    region: singapore
    maxmemoryPolicy: allkeys-lru

  - type: redis
    name: clan-identity-redis-dev
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru

  # ──────────────────────────────────────────────────────────────────────
  # AUTH SERVICE — PRODUCTION  (encryption ON)
  # ──────────────────────────────────────────────────────────────────────
  - type: web
    name: clan-auth-service-prod
    env: docker
    region: singapore
    plan: starter
    dockerfilePath: ./clan-identity-be/deploy/Dockerfile
    dockerContext: ./clan-identity-be
    buildArgs:
      - key: SERVICE_NAME
        value: auth-service
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: POSTGRES_HOST
        fromDatabase:
          name: clan-identity-db-prod
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: clan-identity-db-prod
          property: port
      - key: POSTGRES_USER
        fromDatabase:
          name: clan-identity-db-prod
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: clan-identity-db-prod
          property: password
      - key: POSTGRES_DB
        value: auth_service
      - key: REDIS_HOST
        fromService:
          type: redis
          name: clan-identity-redis-prod
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: clan-identity-redis-prod
          property: port
      - key: JWT_SECRET_KEY
        sync: false
      - key: INTERNAL_API_KEY
        sync: false
      - key: PAYLOAD_ENCRYPTION_KEY
        sync: false
      - key: AUTH_SERVICE_ENCRYPTION_KEY
        sync: false
      - fromGroup: prod-encryption

  # ──────────────────────────────────────────────────────────────────────
  # AUTH SERVICE — DEV  (encryption OFF)
